<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in | Virgiana Credit Union</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body class="page-login">
<header class="site-bar">
  <a class="brand" href="./index.html"><span class="bldg" aria-hidden="true"></span>Virgiana Credit Union</a>
  <nav>
    <a href="#locations">Locations</a>
    <a href="#atms">ATMs</a>
    <a href="#contact">Contact</a>
  </nav>
</header>
<main class="login-stage">
  <section class="login-card">
    <p class="login-mark"><span class="bldg" aria-hidden="true"></span>VIRGIANA CREDIT UNION</p>
    <form id="loginForm">
      <label for="user">Username</label>
      <div class="field">
        <input id="user" name="user" autocomplete="username" required value="sandra24">
        <span class="field-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5 19c1.4-3.2 4-5 7-5s5.6 1.8 7 5"/></svg>
        </span>
      </div>
      <label for="pass">Password</label>
      <div class="field">
        <input id="pass" name="pass" type="password" autocomplete="current-password" required value="opor24">
        <button type="button" class="field-ico text" id="showPass">Show</button>
      </div>
      <p class="fine right"><a href="./forgot.html">Forgot?</a></p>
      <button type="submit">Sign in</button>
      <p class="login-err" id="loginErr" hidden>Username or password is incorrect.</p>
    </form>
    <p class="enroll">First time user? <a href="./enroll.html">Enroll now.</a></p>
  </section>
  <div class="stage-mark" aria-hidden="true"></div>
</main>
<footer class="site-foot" id="contact">
  <p>
    <a href="#privacy">Privacy</a>
    <a href="#security">Security</a>
    <a href="#disclosures">Disclosures</a>
    <a href="#locations">Locations</a>
  </p>
  <p>© 2026 Virgiana Credit Union · Routing 251473820</p>
</footer>
<script>
  const pass = document.getElementById("pass");
  document.getElementById("showPass").addEventListener("click", (e) => {
    const hide = pass.type === "password";
    pass.type = hide ? "text" : "password";
    e.currentTarget.textContent = hide ? "Hide" : "Show";
  });
  document.getElementById("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const user = document.getElementById("user").value.trim();
    const password = document.getElementById("pass").value;
    const err = document.getElementById("loginErr");
    if (user !== "sandra24" || password !== "opor24") {
      err.hidden = false;
      return;
    }
    err.hidden = true;
    sessionStorage.setItem("oporBankUser", "sandra24");
    location.href = "./dashboard.html";
  });
</script>
</body>
</html>
